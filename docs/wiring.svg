<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf7f2"/>
      <stop offset="0.6" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c9d6e6" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3553"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="boardHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4a72"/>
      <stop offset="1" stop-color="#2a3553"/>
    </linearGradient>
    <linearGradient id="cardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f6ff"/>
    </linearGradient>
    <linearGradient id="cardWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2e6"/>
      <stop offset="1" stop-color="#ffd9bf"/>
    </linearGradient>
    <linearGradient id="cardCool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <linearGradient id="lampGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ee07d"/>
      <stop offset="1" stop-color="#26b65a"/>
    </linearGradient>
    <linearGradient id="lampYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe070"/>
      <stop offset="1" stop-color="#f2b730"/>
    </linearGradient>
    <linearGradient id="lampRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5c"/>
      <stop offset="1" stop-color="#df3f3a"/>
    </linearGradient>
    <linearGradient id="wireGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d96e"/>
      <stop offset="1" stop-color="#1f9f4f"/>
    </linearGradient>
    <linearGradient id="wireYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe070"/>
      <stop offset="1" stop-color="#f2b730"/>
    </linearGradient>
    <linearGradient id="wireRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5c"/>
      <stop offset="1" stop-color="#df3f3a"/>
    </linearGradient>
    <linearGradient id="wireSiren" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9b52"/>
      <stop offset="1" stop-color="#f26a1b"/>
    </linearGradient>
    <linearGradient id="wireGnd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8ba1"/>
      <stop offset="1" stop-color="#2f3a4a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1b30" flood-opacity="0.25"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 22px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #0b1b30; }
      .subtitle { font: 14px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #3a4a66; }
      .pin { font: 13px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #e9f0ff; }
      .label { font: 13px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #0b1b30; }
      .small { font: 12px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #3b4a66; }
      .note { font: 12px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #5c4a1f; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="600" fill="url(#grid)" opacity="0.45"/>
  <circle cx="880" cy="80" r="120" fill="#ffe3cc" opacity="0.45"/>
  <circle cx="140" cy="520" r="130" fill="#d8efff" opacity="0.5"/>

  <text x="40" y="35" class="title">Arduino Mega 2560 Stack Light Wiring</text>
  <text x="40" y="55" class="subtitle">D22/D24/D26/D28 -> drivers -> stack light + siren (12-24V)</text>
  <line x1="40" y1="70" x2="960" y2="70" stroke="#c9d6e6" stroke-width="2"/>

  <rect x="40" y="90" width="320" height="450" rx="18" fill="url(#board)" stroke="#111827" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="60" y="112" width="280" height="30" rx="8" fill="url(#boardHeader)"/>
  <text x="78" y="133" class="pin">Arduino Mega 2560</text>

  <circle cx="78" cy="175" r="5" fill="#35d96e"/>
  <text x="92" y="179" class="pin">D22 (Green)</text>
  <circle cx="78" cy="225" r="5" fill="#ffe070"/>
  <text x="92" y="229" class="pin">D24 (Yellow)</text>
  <circle cx="78" cy="275" r="5" fill="#ff6b5c"/>
  <text x="92" y="279" class="pin">D26 (Red)</text>
  <circle cx="78" cy="325" r="5" fill="#ff9b52"/>
  <text x="92" y="329" class="pin">D28 (Siren)</text>
  <circle cx="78" cy="375" r="5" fill="#94a3b8"/>
  <text x="92" y="379" class="pin">GND (Common)</text>
  <circle cx="78" cy="425" r="5" fill="#5aa9ff"/>
  <text x="92" y="429" class="pin">D13 (Heartbeat)</text>

  <rect x="360" y="86" width="300" height="26" rx="8" fill="#fff2bf" stroke="#e1c56b" stroke-width="1.5"/>
  <text x="372" y="104" class="note">Use relay/MOSFET driver + flyback diode</text>

  <rect x="440" y="120" width="230" height="230" rx="16" fill="url(#cardLight)" stroke="#d0d9e8" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="456" y="138" width="198" height="26" rx="8" fill="#eef3ff"/>
  <text x="466" y="156" class="label">Stack Light (12-24V)</text>
  <rect x="470" y="170" width="170" height="40" rx="10" fill="url(#lampGreen)" stroke="#1f8d4d" stroke-width="1.5"/>
  <rect x="474" y="174" width="162" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
  <text x="540" y="196" class="label">Green</text>
  <rect x="470" y="220" width="170" height="40" rx="10" fill="url(#lampYellow)" stroke="#c8971d" stroke-width="1.5"/>
  <rect x="474" y="224" width="162" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
  <text x="538" y="246" class="label">Yellow</text>
  <rect x="470" y="270" width="170" height="40" rx="10" fill="url(#lampRed)" stroke="#a83228" stroke-width="1.5"/>
  <rect x="474" y="274" width="162" height="12" rx="6" fill="#ffffff" opacity="0.35"/>
  <text x="546" y="296" class="label">Red</text>

  <rect x="440" y="375" width="230" height="130" rx="16" fill="url(#cardWarm)" stroke="#f3c7a8" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="456" y="392" width="198" height="26" rx="8" fill="#ffe9d6"/>
  <text x="474" y="410" class="label">Siren (12-24V)</text>
  <text x="470" y="438" class="small">Trigger via relay/MOSFET</text>

  <rect x="720" y="160" width="230" height="150" rx="16" fill="url(#cardCool)" stroke="#b7d5f6" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="736" y="178" width="198" height="26" rx="8" fill="#d9ecff"/>
  <text x="752" y="196" class="label">12-24V Supply</text>
  <text x="740" y="226" class="small">+V -> loads</text>
  <text x="740" y="246" class="small">GND -> common</text>

  <line x1="360" y1="175" x2="440" y2="190" stroke="url(#wireGreen)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
  <line x1="360" y1="225" x2="440" y2="240" stroke="url(#wireYellow)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
  <line x1="360" y1="275" x2="440" y2="290" stroke="url(#wireRed)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
  <line x1="360" y1="325" x2="440" y2="430" stroke="url(#wireSiren)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>

  <line x1="360" y1="375" x2="720" y2="250" stroke="url(#wireGnd)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="380" y="368" class="small">Common GND</text>

  <line x1="670" y1="210" x2="720" y2="210" stroke="#7aa7e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="670" y1="240" x2="720" y2="240" stroke="#7aa7e1" stroke-width="3" stroke-linecap="round"/>
  <text x="682" y="210" class="small">+V</text>
  <text x="682" y="240" class="small">GND</text>

  <circle cx="360" cy="175" r="4" fill="#35d96e"/>
  <circle cx="360" cy="225" r="4" fill="#ffe070"/>
  <circle cx="360" cy="275" r="4" fill="#ff6b5c"/>
  <circle cx="360" cy="325" r="4" fill="#ff9b52"/>
  <circle cx="360" cy="375" r="4" fill="#94a3b8"/>
</svg>
