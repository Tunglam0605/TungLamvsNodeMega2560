<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2e9"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f7f8ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#c8d7ea" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
    <linearGradient id="wireGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44e07a"/>
      <stop offset="1" stop-color="#22b55b"/>
    </linearGradient>
    <linearGradient id="wireYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe380"/>
      <stop offset="1" stop-color="#f2b730"/>
    </linearGradient>
    <linearGradient id="wireRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f60"/>
      <stop offset="1" stop-color="#df3f3a"/>
    </linearGradient>
    <linearGradient id="wireSiren" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffab63"/>
      <stop offset="1" stop-color="#f26a1b"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ef7a1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1bb35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe89b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2b730" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a90" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#df3f3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1b30" flood-opacity="0.25"/>
    </filter>
    <style>
      .title { font: 700 28px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #0b1b30; }
      .subtitle { font: 14px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #3a4a66; }
      .chip { font: 12px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #0b1b30; }
      .chipText { font: 12px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #2b3a55; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="380" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1050" cy="60" r="140" fill="#ffd9c2" opacity="0.5"/>
  <circle cx="150" cy="310" r="150" fill="#d3ecff" opacity="0.55"/>

  <text x="60" y="70" class="title">STACK LIGHT + SIREN CONTROLLER</text>
  <text x="60" y="100" class="subtitle">Arduino Mega 2560 | Timer3 100 Hz | Non-blocking Serial</text>

  <rect x="60" y="125" width="170" height="28" rx="14" fill="#ffffff" stroke="#d6e3f4"/>
  <text x="74" y="144" class="chipText">Serial0 / USB</text>
  <rect x="240" y="125" width="165" height="28" rx="14" fill="#ffffff" stroke="#d6e3f4"/>
  <text x="254" y="144" class="chipText">Fail-safe Timeout</text>
  <rect x="415" y="125" width="150" height="28" rx="14" fill="#ffffff" stroke="#d6e3f4"/>
  <text x="428" y="144" class="chipText">No delay()</text>

  <line x1="60" y1="170" x2="700" y2="170" stroke="#c9d6e6" stroke-width="2"/>
  <text x="60" y="195" class="subtitle">Color-coded lines map to D22/D24/D26/D28</text>

  <line x1="200" y1="230" x2="820" y2="190" stroke="url(#wireGreen)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="255" x2="820" y2="215" stroke="url(#wireYellow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="3.4s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="280" x2="820" y2="240" stroke="url(#wireRed)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="3.1s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="305" x2="820" y2="290" stroke="url(#wireSiren)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <circle cx="930" cy="200" r="56" fill="url(#glowGreen)" opacity="0.6">
    <animate attributeName="r" values="50;62;50" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="145" r="56" fill="url(#glowYellow)" opacity="0.6">
    <animate attributeName="r" values="50;62;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="90" r="56" fill="url(#glowRed)" opacity="0.6">
    <animate attributeName="r" values="50;62;50" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#softShadow)">
    <rect x="880" y="60" width="100" height="210" rx="18" fill="#1b2232"/>
    <circle cx="930" cy="90" r="32" fill="#ff6b5c" stroke="#b23a33" stroke-width="2"/>
    <circle cx="930" cy="145" r="32" fill="#ffe070" stroke="#c89b1b" stroke-width="2"/>
    <circle cx="930" cy="200" r="32" fill="#35d96e" stroke="#1f8d4d" stroke-width="2"/>
    <rect x="900" y="240" width="60" height="18" rx="8" fill="#2b364b"/>
    <rect x="890" y="258" width="80" height="16" rx="8" fill="#364057"/>
  </g>

  <g>
    <circle cx="1005" cy="270" r="18" fill="#ff9b52" stroke="#d4641c" stroke-width="2"/>
    <path d="M 1028 262 C 1045 270, 1045 270, 1028 278" fill="none" stroke="#ff9b52" stroke-width="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1036 256 C 1058 270, 1058 270, 1036 284" fill="none" stroke="#ff9b52" stroke-width="2">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
    </path>
  </g>

  <circle cx="520" cy="210" r="5" fill="#ffd18b" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="235" r="4" fill="#7ef7a1" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="600" cy="260" r="4" fill="#9dd3ff" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
</svg>
