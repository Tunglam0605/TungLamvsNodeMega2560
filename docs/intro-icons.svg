<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#fff4e8"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2e8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1b30" flood-opacity="0.18"/>
    </filter>
    <style>
      .label { font: 12px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #2b3a55; }
      .title { font: 13px "Montserrat", "Segoe UI", Arial, sans-serif; fill: #0b1b30; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="170" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
    <rect x="40" y="20" width="260" height="130" rx="16" fill="url(#cardA)" stroke="#d6e3f4"/>
    <rect x="330" y="20" width="260" height="130" rx="16" fill="url(#cardB)" stroke="#f1d4bf"/>
    <rect x="620" y="20" width="260" height="130" rx="16" fill="url(#cardA)" stroke="#d6e3f4"/>
    <rect x="910" y="20" width="260" height="130" rx="16" fill="url(#cardB)" stroke="#f1d4bf"/>
  </g>

  <g>
    <circle cx="100" cy="70" r="26" fill="#dff6ff" stroke="#7aa7e1" stroke-width="2"/>
    <circle cx="100" cy="70" r="18" fill="none" stroke="#4e7bc0" stroke-width="2"/>
    <line x1="100" y1="70" x2="100" y2="55" stroke="#4e7bc0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 100 70" to="360 100 70" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="70" x2="112" y2="78" stroke="#4e7bc0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 100 70" to="360 100 70" dur="8s" repeatCount="indefinite"/>
    </line>
    <text x="70" y="120" class="title">Timer3 100 Hz</text>
    <text x="70" y="138" class="label">Stable blinking</text>
  </g>

  <g>
    <path d="M 380 80 C 395 55, 435 55, 450 80" fill="none" stroke="#ff9b52" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 450 80 C 435 105, 395 105, 380 80" fill="none" stroke="#ff9b52" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <polygon points="448,78 465,80 448,82" fill="#ff9b52"/>
    <text x="360" y="120" class="title">Non-blocking</text>
    <text x="362" y="138" class="label">No delay()</text>
  </g>

  <g>
    <circle cx="700" cy="70" r="6" fill="#35d96e">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="70" r="6" fill="#ffe070">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="740" cy="70" r="6" fill="#ff6b5c">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <line x1="680" y1="92" x2="760" y2="92" stroke="#8aa0c2" stroke-width="2"/>
    <text x="660" y="120" class="title">Serial protocol</text>
    <text x="662" y="138" class="label">ASCII commands</text>
  </g>

  <g>
    <path d="M 1005 52 L 1040 52 L 1040 78 C 1040 98 1023 110 1005 118 C 987 110 970 98 970 78 L 970 52 Z" fill="#e7f6ed" stroke="#33a05d" stroke-width="2"/>
    <path d="M 1005 62 L 1028 62 L 1028 78 C 1028 90 1016 99 1005 104 C 994 99 982 90 982 78 L 982 62 Z" fill="#35d96e" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <text x="960" y="120" class="title">Fail-safe</text>
    <text x="960" y="138" class="label">Timeout to IDLE</text>
  </g>
</svg>
